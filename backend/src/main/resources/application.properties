# Spring Boot Application Configuration
spring.application.name=UniGear Tracker Backend

# Database Configuration - PostgreSQL (Supabase)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# H2 Console (optional, for debugging)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations (disabled - using Java-based initialization)
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.unigear=DEBUG
logging.level.org.springframework.security=DEBUG

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=uploads

# CORS Configuration
server.servlet.web.servlet.register-default-servlet=true
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allow-credentials=true

# OAuth2 Authorization Redirect URI
app.oauth2.authorizedRedirectUri=${OAUTH2_REDIRECT_URI:http://localhost:3000}

# OAuth2 Configuration - Google
spring.security.oauth2.client.auto=true
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:337178781741-ni5i0qncn1r4radp8662ddn6p9q9qhio.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET: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}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Admin Email for role assignment
app.admin.email=admin@unigear.com

# JWT Configuration
app.jwt.secret=${JWT_SECRET:01234567890123456789012345678901}
app.jwt.expirationMs=${JWT_EXPIRATION:86400000}

# Disable Spring DevTools classloader restart to avoid NoClassDefFoundError in IDE runs
spring.devtools.restart.enabled=false


