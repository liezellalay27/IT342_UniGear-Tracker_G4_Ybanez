<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Request Received</title>
  </head>
  <body style="font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;padding:20px;">
    <div style="max-width:600px;margin:0 auto;border:1px solid #eee;padding:20px;border-radius:8px;">
      <h2 style="color:#1a73e8">Request Received</h2>
      <p>Hi,</p>
      <p>We received your equipment request and it's now under review by our staff.</p>
      <table style="width:100%;border-collapse:collapse;margin-top:12px;">
        <tr><td style="padding:6px;border:1px solid #eee;width:140px"><strong>Request ID</strong></td><td style="padding:6px;border:1px solid #eee">[[${requestId}]]</td></tr>
        <tr><td style="padding:6px;border:1px solid #eee"><strong>Equipment</strong></td><td style="padding:6px;border:1px solid #eee">[[${equipmentName}]]</td></tr>
        <tr><td style="padding:6px;border:1px solid #eee"><strong>Quantity</strong></td><td style="padding:6px;border:1px solid #eee">[[${quantity}]]</td></tr>
      </table>
      <p style="margin-top:16px">We'll notify you when a decision has been made.<br/>Thanks,<br/>UniGear Tracker</p>
    </div>
  </body>
</html>
