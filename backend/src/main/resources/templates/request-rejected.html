<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Rejected</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f1ea;font-family:Arial,Helvetica,sans-serif;color:#222;">
    <div style="max-width:640px;margin:0 auto;padding:24px;">
      <div style="background:#550000;color:#fff;padding:24px 28px;border-radius:16px 16px 0 0;">
        <div style="font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#f6d36b;">UniGear Tracker</div>
        <h1 style="margin:10px 0 0;font-size:30px;line-height:1.2;">Request Update</h1>
      </div>
      <div style="background:#fff;border:1px solid #eadfcd;border-top:none;border-radius:0 0 16px 16px;padding:28px;">
        <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">Hi <strong>[[${studentName}]]</strong>,</p>
        <p style="margin:0 0 16px;font-size:15px;line-height:1.7;">We're sorry to let you know that your equipment request has been <strong style="color:#d32f2f;">rejected</strong>.</p>
        <div style="margin:20px 0;padding:16px;border-radius:12px;background:#fff7f7;border:1px solid #f4c3c3;">
          <div style="font-size:13px;color:#8b0000;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Reason</div>
          <div style="font-size:15px;line-height:1.7;color:#333;">[[${reason}]]</div>
        </div>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#555;">If you believe this was a mistake, please reply to this email or contact UniGear Tracker support.</p>
        <p style="margin:16px 0 0;font-size:14px;line-height:1.6;">Thanks,<br/><strong>UniGear Tracker</strong></p>
      </div>
    </div>
  </body>
</html>
